apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nginx-demo-qa

resources:
  - ../../base

# Distinct localhost port per stage on Docker Desktop (LoadBalancer provider).
patches:
  - target:
      kind: Service
      name: web
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8082
