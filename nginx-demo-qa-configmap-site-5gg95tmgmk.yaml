data:
  about.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>About - nginx-gitops-demo</title>
      <link rel="stylesheet" href="style.css">
    </head>
    <body>
      <header>
        <nav>
          <a class="brand" href="index.html">nginx-gitops-demo</a>
          <a href="index.html">Home</a>
          <a href="about.html" class="active">About</a>
        </nav>
      </header>
      <main>
        <section class="hero">
          <h1>About this lab</h1>
          <p>A small, public repository used to practise GitOps promotion with Argo CD and Kargo.</p>
        </section>
        <section class="cards">
          <article>
            <h2>Source of truth</h2>
            <p><code>main</code> holds the Kustomize sources. The <code>stage/*</code> branches hold the rendered manifests that Argo CD deploys.</p>
          </article>
          <article>
            <h2>What Kargo watches</h2>
            <p>The public nginx image on Docker Hub and the files under <code>base/html/</code>.</p>
          </article>
        </section>
      </main>
      <footer>Local lab on Docker Desktop Kubernetes</footer>
    </body>
    </html>
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>nginx-gitops-demo</title>
      <link rel="stylesheet" href="style.css">
    </head>
    <body>
      <header>
        <nav>
          <a class="brand" href="index.html">nginx-gitops-demo</a>
          <a href="index.html" class="active">Home</a>
          <a href="about.html">About</a>
        </nav>
      </header>
      <main>
        <section class="hero">
          <h1>Promoted by Kargo, deployed by Argo CD</h1>
          <p>This page is served by nginx from a ConfigMap generated by Kustomize.
             Change a file in <code>base/html/</code> or bump the nginx image and
             watch the change move through dev, qa and prod.</p>
          <p class="badge">site version: v2</p>
        </section>
        <section class="cards">
          <article>
            <h2>1. Commit</h2>
            <p>Edit the HTML on <code>main</code>. Kargo's Warehouse notices the new commit and creates Freight.</p>
          </article>
          <article>
            <h2>2. Promote</h2>
            <p>Kargo renders the manifests for a stage and opens a pull request against its stage branch.</p>
          </article>
          <article>
            <h2>3. Sync</h2>
            <p>After you merge, Argo CD syncs the stage branch and rolls the pods.</p>
          </article>
        </section>
      </main>
      <footer>Local lab on Docker Desktop Kubernetes</footer>
    </body>
    </html>
  style.css: |
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e3a5f 0%, var(--bg) 60%);
      color: var(--text);
      line-height: 1.6;
    }

    header { background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid #334155; }

    nav {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover, nav a.active { color: var(--accent); }
    nav .brand { color: var(--text); font-weight: 700; margin-right: auto; }

    main { flex: 1; max-width: 960px; margin: 0 auto; padding: 3rem 1.5rem; width: 100%; }

    .hero h1 { font-size: 2.25rem; margin: 0 0 1rem; }
    .hero p { color: var(--muted); max-width: 40rem; }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent) !important;
      font-size: 0.875rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-top: 2.5rem;
    }

    article {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
    }

    article h2 { margin-top: 0; font-size: 1.1rem; color: var(--accent); }
    article p { margin-bottom: 0; color: var(--muted); }

    code { background: #0b1220; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.9em; }

    footer { text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.875rem; }
kind: ConfigMap
